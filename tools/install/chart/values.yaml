# Parameters, not a deployment.
#
# What a platform is made of — which peers exist, which ports they dial, how
# storage is shaped, how the gateway is wired — is the same in every install
# and lives in `templates/platform.yaml`. Only the things that genuinely differ
# between one workspace and the next are here. A copy of the full spec in this
# file would just be a second source of truth waiting to drift from the first.

# ---------------------------------------------------------------------------
# The workspace
# ---------------------------------------------------------------------------

# Namespace and Platform name. Everything else that is named per workspace —
# the secret, the TLS secret, the images, the solution key — is derived from
# it, so a second workspace is this one line and a profile. Empty means the
# release namespace, which is usually the same thing said twice.
workspace: ""

# mono  — one behemoth for the whole platform
# multi — one behemoth per shard, split by scope
# cloud — no platform storage; one behemoth per Tenant
profile: cloud

# Tenant and platform hostnames are derived from this: `<name>.<domainBase>`.
# No default: a hostname belongs to whoever is installing, not to the chart.
domainBase: ""

# ---------------------------------------------------------------------------
# The operator
# ---------------------------------------------------------------------------

# Platform, Solution and Tenant are cluster-scoped, so the first operator
# already sees every platform in the cluster. Set false for every release
# after the first: those add a Platform and nothing else.
operator:
  create: true
  # Published registry.json. When set, Ptah refreshes digest maps from this
  # index on every reconcile instead of relying on a copied Platform mapping.
  registryIndexUrl: ""

image:
  repository: public.ecr.aws/i5x9u8b2/ptah
  tag: latest
  # `latest` is deliberately mutable, so retaining a node-cached operator
  # silently runs an older policy than the installer and source tree expect.
  pullPolicy: Always

# More than one replica is safe: only the lease holder reconciles. A second
# replica buys a faster failover, not more throughput.
replicaCount: 1
leaderElection: true

# Ptah resyncs on a timer rather than watching, and a pass with no changes is
# nearly free, so this is a latency knob and not a load one.
resyncSeconds: 30

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

moduleCache:
  size: 4Gi
  # Empty means the cluster's default StorageClass. Naming one here instead
  # would pin the operator to k3s' provisioner on every cluster it is installed
  # into; the installer passes whatever class it was told to use.
  storageClassName: ""

serviceAccount:
  create: true
  name: ""

# Ptah writes cluster-scoped PersistentVolumes and reads cluster-scoped custom
# resources, so its role cannot be namespaced.
rbac:
  create: true

# ---------------------------------------------------------------------------
# The platform
# ---------------------------------------------------------------------------

# Set false to install the operator alone and manage Platform objects out of
# band — useful when one operator serves several platforms.
platform:
  create: true

# Extra environment for the platform's workloads, read straight through to
# `Platform.spec.env`. Empty by default: everything a platform needs is derived.
env: {}

# Where ui and ms images come from. The names are built as
# `<registry>/<workspace>-ui:<tag>`, which is what the build publishes.
images:
  registry: public.ecr.aws/i5x9u8b2
  tag: latest

# Always-on peers of the message bus, written to `Platform.spec.apps`.
#
# `repository` names the image inside `images.registry`; set `image` instead to
# pin a full reference, or `tag` to override `images.tag` for one peer. Every
# other key is handed to the policy untouched — `ports`, `portEnv`, `env`,
# `hostNetwork`, `replicas`, `resources`. Helm merges maps, so overriding one
# field of one peer leaves the rest of this block in place.
#
# fujin must declare both ports: `ws` is what the gateway targets, `zmq` is what
# every other peer dials.
apps:
  fujin:
    repository: fujin
    ports:
      ws: 8087
      zmq: 5557
  centimanus:
    repository: centimanus
    fujinTarget: centimanus
    fujinEndpointEnv: CENTIMANUS_FUJIN_ZMQ_ENDPOINT
    ports:
      http: 9000
  resonus:
    repository: resonus
    fujinTarget: resonus
    fujinEndpointEnv: RESONUS_FUJIN_ZMQ_ENDPOINT
    # Resonus terminates WebRTC. ICE needs a stable, publicly routable UDP
    # range, and behind the pod overlay those sockets are NATed and unreachable
    # from the browser — which is why this peer runs on the host's network
    # rather than the pod's. The range below is what the node must allow in.
    hostNetwork: true
    ports:
      http: 8090
    portEnv:
      http: LLM_GATE_HTTP_PORT
    env:
      LLM_GATE_ICE_PORT_RANGE_BEGIN: "10000"
      LLM_GATE_ICE_PORT_RANGE_END: "10100"

# Compute peers deployed only while a solution asks for them, written to
# `Platform.spec.processors`. Same shape as `apps`.
processors:
  curaengine:
    repository: curaengine
    fujinTarget: curaengine
    fujinEndpointEnv: CURAENGINE_FUJIN_ZMQ_ENDPOINT
  opencamlib:
    repository: opencamlib
    fujinTarget: opencamlib
    fujinEndpointEnv: OPENCAMLIB_FUJIN_ZMQ_ENDPOINT

# Native services shared by every platform workspace. These are selected by
# the solution's `containers.ai` group and run in their own namespace.
sharedApps:
  namespace: ai
  # Only this Platform owns the shared namespace. Other workspaces reference
  # the same Services and do not redeploy the AI containers.
  ownerPlatform: converged
  apps:
    case:
      repository: case
      ports:
        http: 8000
      portEnv:
        http: CASE_PORT
      probePath: /healthz
    params:
      repository: params
      ports:
        http: 8001
      portEnv:
        http: PARAMS_PORT
      probePath: /healthz
    speach:
      repository: speach
      ports:
        http: 8002
      portEnv:
        http: SPEACH_PORT
      probePath: /healthz

storage:
  size: 5Gi

  # How the claims ptah writes get filled.
  #
  # dynamic — a provisioner in the cluster creates the volume behind each
  #           claim. The default, and the only form that survives an uninstall
  #           and reinstall unattended: the volume belongs to the claim, so it
  #           goes away with it instead of surviving as a Released volume that
  #           refuses to rebind.
  # static  — ptah declares the volumes as well, pinned to a directory on one
  #           node. For a host whose disk layout is the reason it was chosen.
  #           Read `storage.static` before selecting it.
  mode: dynamic

  # `dynamic` only: which provisioner serves the claims. `local-path` is what
  # k3s ships and is why it is the default here; on a cluster with real storage
  # this is the one line that changes.
  #
  # It also decides where the data lands, which is a property of that
  # provisioner and not of this chart: local-path writes under the root in its
  # own `local-path-config` ConfigMap, normally /var/lib/rancher/k3s/storage.
  storageClassName: local-path

  # `static` only, ignored in dynamic mode.
  static:
    # The class the declared volumes and their claims carry. Left empty the
    # chart creates `<workspace>-local` for them: a class with no provisioner
    # behind it, so nothing else in the cluster answers these claims. Naming a
    # provisioner's class here instead — `local-path`, say — would leave that
    # provisioner and ptah both owning the same claim.
    #
    # Set it to a class you already maintain and the chart creates nothing and
    # uses that one.
    storageClassName: ""

    # Where a volume's data lands on the node. Each microservice gets its own
    # directory under this root, created on first mount.
    hostPath: /var/lib/ptah

    # Required. Node-local data does not follow a rescheduled pod, and the
    # failure is silent: the new node gets an empty directory and behemoth
    # starts on it. ptah refuses a static platform without this.
    #
    # nodeAffinity:
    #   required:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #           - key: kubernetes.io/hostname
    #             operator: In
    #             values: [node-1]
    nodeAffinity: {}

gateway:
  className: traefik
  httpsPort: 443
  # With an issuer ptah emits a cert-manager Certificate; without one the
  # secret is expected to exist already.
  issuer: ""
  issuerKind: ClusterIssuer

# Where modules and the base solution configuration are fetched from. Leave
# empty to run entirely from what is baked into the images.
registry:
  url: ""
  revision: ""
  # Registry object path -> lowercase SHA-256. The source is `<url>/<path>`.
  modules: {}
  workflows: {}

# Required by the `multi` profile, ignored otherwise: which scopes land on
# which behemoth. Exactly one shard must claim "*".
shards: []
# - name: alpha
#   scopes: [acme, globex]
#   size: 50Gi
# - name: rest
#   scopes: ["*"]

# Product composition belongs to the Platform, not to a Tenant. Every cloud
# Tenant with no explicit solution selection receives this base solution. Keep
# this in the chart so a workspace can bootstrap without a registry; when
# `registry.url` is configured, ptah adds the matching proxy and digests to
# the same module environment.
#
# This is the resolved form of modules/solutions/converged.json. Its source
# fragments are used by local development; this chart value is the install-time
# platform contract and deliberately has the same name as that product.
solutions:
  converged:
    containers:
      converged:
        - ui
        - ms
        - resonus
        - behemoth
        - ptah
        - fujin
        - centimanus
      ai:
        - case
        - params
    repositories:
      - access
      - auth
      - identity
      # Each user's saved workspace: the surfaces they pinned.
      - environment
      # The mail layer: letter templates, sender profile, delivery journal.
      - notify
      - markdown
      - struct
      - galery
      - assistant
      - calls
      - contexts
      - threads
      - dag
      - files
      - store
      - requests
      - logs
      - telemetry
      - counters
      - usage
      - dashboard
      - sheduller
      - webhooks
      - community
      - chats
      - support
      # The production floor: orders, the machines that run them, and the
      # event log the two write into.
      - orders
      - equipment
      - events
      # The review system: the reviews themselves and the one-shot links that
      # asked for them.
      - reviews
      # The team: staff cards, shifts and absences.
      - staff
      - billing
      - metering
      - invoices
    lambdas:
      - ses
      - compressors
      # wf-file-analyze converts every model to a GLB through it; without the
      # lambda a request gets no previews.
      - modelconvertor
    surfaces:
      - auth
      - assistants
      - calls
      - contexts
      - threads
      - requests
      - files
      - logs
      - telemetry
      - usage
      - dasboards
      - automation
      - community
      - chats
      - support
      - orders
      - equipment
      - reviews
      - team
    processors:
      - curaengine
      - opencamlib
    # The resolved form of modules/solutions/mapping.json filtered by the
    # `workflows` of modules/solutions/solutions/requests.json. Every script a
    # workflow reaches through rt.sub must be listed too: centimanus resolves a
    # delegation through this same list (rp-dag listAvailableWorkflows), so an
    # unlisted child fails the parent with WorkflowNotFound.
    # brief/description/parameters are what publishes a workflow to the chat
    # catalog; the two internal ones are deliberately left without them, so the
    # assistant cannot call what only a parent workflow or rp-requests starts.
    # Resolved form of modules/solutions/mapping.json filtered by the
    # solution fragments. Every script a workflow reaches through rt.sub must
    # be listed too: centimanus resolves a delegation through this same list
    # (rp-dag listAvailableWorkflows), so an unlisted child fails the parent
    # with WorkflowNotFound. brief/description/parameters publish a workflow to
    # the chat catalog; paramsExample prefills the admin run form.
    workflows:
      - id: files-process
        name: wf-files-process
        script: workflows/wf-files-process.js
        brief: Process uploaded files
        description: Expand ZIP archives and classify every uploaded file, reporting
          which of them are production models. Does not create a request.
        parameters:
          type: object
          properties:
            fileIds:
              type: array
              items:
                type: string
          required:
            - fileIds
        paramsExample:
          fileIds:
            - <file-id>
      - id: file-unpack
        name: wf-file-unpack
        script: workflows/wf-file-unpack.js
        brief: Unpack an uploaded archive
        description: Extract a ZIP archive and return IDs of its entries.
        parameters:
          type: object
          properties:
            fileId:
              type: string
          required:
            - fileId
        paramsExample:
          fileId: <file-id>
      - id: file-analyze
        name: wf-file-analyze
        script: workflows/wf-file-analyze.js
        brief: Analyze one uploaded file
        description: Stage one file, detect its type, convert it to a preview where
          possible and estimate production parameters. Skips files that are not
          production models.
        parameters:
          type: object
          properties:
            fileId:
              type: string
              description: The file to analyze
            collectionId:
              type: string
              description: Attach the result to this file collection
            owner:
              type: string
            processId:
              type: string
            options:
              type: object
              description: "Analyze options: target cnc|print|generic, includeGcode,
                convertPreview"
          required:
            - fileId
        paramsExample:
          fileId: <file-id>
      - id: files-analyze
        name: wf-files-analyze
        script: workflows/wf-files-analyze.js
        brief: Analyze a batch of uploaded files
        description: Run the single-file analysis over every production model in the
          batch and report per-file estimates and errors.
        parameters:
          type: object
          properties:
            fileIds:
              type: array
              items:
                type: string
              description: The files to analyze
            collectionId:
              type: string
              description: Attach results to this file collection
            owner:
              type: string
            processId:
              type: string
            options:
              type: object
              description: "Analyze options: target cnc|print|generic, includeGcode,
                convertPreview"
          required:
            - fileIds
        paramsExample:
          fileIds:
            - <file-id>
      - id: request-analyze
        name: wf-request-analyze
        script: workflows/wf-request-analyze.js
        brief: Analyze the models of a request
        description: Read the request's files, analyze every production model in it and
          attach the estimates back to the request.
        parameters:
          type: object
          properties:
            requestId:
              type: string
              description: The request whose files to analyze
            owner:
              type: string
            processId:
              type: string
            options:
              type: object
              description: "Analyze options: target cnc|print|generic, includeGcode,
                convertPreview"
          required:
            - requestId
        paramsExample:
          requestId: <request-id>
      - id: request-to-order
        name: wf-request-to-order
        script: workflows/wf-request-to-order.js
        brief: Turn a request into a shop order
        description: "Create the production order for an accepted manufacturing request:
          the order carries the requestId, the request moves to in_production and
          the step lands in the journal. Quantity, material, deadline and contact
          are read off the request; anything given here overrides them. Running it
          twice answers with the order that already exists."
        parameters:
          type: object
          properties:
            requestId:
              type: string
              description: The request to convert
            productionMethod:
              type: string
              enum:
                - fdm
                - sla
                - sls
                - dmls
                - polyjet
                - cnc
                - laser
                - generic
              description: Overrides the method derived from the request's process type
            quantity:
              type: number
            material:
              type: string
            weightGrams:
              type: number
            dueAt:
              type: string
              description: ISO date the job is due
            equipmentId:
              type: string
              description: Assign the job to a machine straight away
            customerName:
              type: string
            customerEmail:
              type: string
              description: Where the review request will be sent once the job ships
            notes:
              type: string
          required:
            - requestId
        paramsExample:
          requestId: <request-id>
      - id: equipment-incident
        name: wf-equipment-incident
        script: workflows/wf-equipment-incident.js
        brief: Report a machine breakdown
        description: "Report that a machine is down: it is set to error, the incident
          lands in its journal, the slot it was running is cancelled and the order
          on that slot is blocked, and everyone in the workspace is notified. Future
          bookings are not moved — they come back as at risk for the shop to
          re-plan."
        parameters:
          type: object
          properties:
            equipmentId:
              type: string
              description: The machine that broke
            description:
              type: string
              description: What happened, in the reporter's words
            severity:
              type: string
              enum:
                - warning
                - error
                - critical
            dryRun:
              type: boolean
              description: Show what would be cancelled and blocked without changing anything
          required:
            - equipmentId
        paramsExample:
          equipmentId: <equipment-id>
          description: Spindle stopped mid-cut, error E-41 on the panel
          severity: error
          dryRun: true
      - id: order-review-request
        name: wf-order-review-request
        script: workflows/wf-order-review-request.js
        brief: Ask a customer for a review
        description: Find one finished order that has a customer and has never been
          asked, mint its personal one-shot review link and send the ask. One mail
          per run; dryRun renders the mail and mints nothing.
        parameters:
          type: object
          properties:
            from:
              type: string
              description: Envelope sender; omit to use the deployment's configured address
            shopName:
              type: string
              description: Name in the letter; omit to use the company's brand
            delayHours:
              type: number
            dryRun:
              type: boolean
            transport:
              type: string
              enum:
                - ses
                - smtp
              description: Which relay this deployment runs; defaults to ses
        paramsExample:
          dryRun: true
      - id: order-review-followup
        name: wf-order-review-followup
        script: workflows/wf-order-review-followup.js
        brief: Chase a quiet review link
        description: Ask once more about a review link that was sent, never opened and
          not yet chased its allowance of times. One mail per run; dryRun renders
          the mail and counts nothing.
        parameters:
          type: object
          properties:
            from:
              type: string
              description: Envelope sender; omit to use the deployment's configured address
            shopName:
              type: string
              description: Name in the letter; omit to use the company's brand
            delayDays:
              type: number
            maxFollowups:
              type: number
            dryRun:
              type: boolean
            transport:
              type: string
              enum:
                - ses
                - smtp
              description: Which relay this deployment runs; defaults to ses
        paramsExample:
          dryRun: true
      - id: team-invite
        name: wf-team-invite
        script: workflows/wf-team-invite.js
        brief: Add people to the console from a list
        description: "Turn a pasted list of people (name + email, in any shape) or an
          uploaded file into user accounts with a role, staff cards and invitations,
          and send each of them a sign-in link. Re-running the same list adds nobody
          twice. Roles it may grant: manager, operator, viewer. dryRun reports what
          it would do and touches nothing."
        parameters:
          type: object
          properties:
            rawText:
              type: string
              description: The pasted list itself
            fileIds:
              type: array
              items:
                type: string
              description: rp-files ids of csv/xlsx/text lists
            preset:
              type: string
              enum:
                - manager
                - operator
                - viewer
              description: Role for everyone in this list
            tags:
              type: array
              items:
                type: string
              description: Group access tags, e.g. team-ops
            invitedBy:
              type: string
            from:
              type: string
              description: Envelope sender; omit to use the deployment's configured address
            consoleUrl:
              type: string
            provider:
              type: string
            model:
              type: string
            dryRun:
              type: boolean
            transport:
              type: string
              enum:
                - ses
                - smtp
              description: Which relay this deployment runs; defaults to ses
        paramsExample:
          rawText: |-
            Anna Ops <anna@example.com>
            Ivan CNC <ivan@example.com>
          preset: operator
          dryRun: true
tenants: {}
