# Three kinds, layered.
#
#   Platform  the base core: routers, cache, storage, ui and ms. Boots alone.
#   Solution  an overlay of modules and workflows laid on top of a platform.
#   Tenant    one site on a cloud platform: its own storage shard and domains.
#
# `spec` is deliberately loose. The policy layer is the single validator, and
# duplicating its rules into OpenAPI would mean two places to change and two
# chances to disagree. The printer columns come from status, which the
# controller owns.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platforms.ptah.io
spec:
  group: ptah.io
  scope: Cluster
  names:
    kind: Platform
    plural: platforms
    singular: platform
    shortNames: [plat]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required: [profile, namespace]
              properties:
                profile:
                  type: string
                  enum: [mono, multi, cloud]
                namespace:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .status.profile
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Solutions
          type: string
          jsonPath: .status.solutions
        - name: Modules
          type: string
          jsonPath: .status.modulesDigest
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: solutions.ptah.io
spec:
  group: ptah.io
  scope: Cluster
  names:
    kind: Solution
    plural: solutions
    singular: solution
    shortNames: [sol]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required: [platform]
              properties:
                platform:
                  type: string
                enabled:
                  type: boolean
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Platform
          type: string
          jsonPath: .status.platform
        - name: Applied
          type: boolean
          jsonPath: .status.applied
        - name: RP
          type: integer
          jsonPath: .status.repositories
        - name: LM
          type: integer
          jsonPath: .status.lambdas
        - name: SF
          type: integer
          jsonPath: .status.surfaces
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.ptah.io
spec:
  group: ptah.io
  scope: Cluster
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required: [platform]
              properties:
                platform:
                  type: string
                storageSize:
                  type: string
                domains:
                  type: array
                  items:
                    type: string
                solutions:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Scope
          type: string
          jsonPath: .status.scope
        - name: Storage
          type: string
          jsonPath: .status.storageHost
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
