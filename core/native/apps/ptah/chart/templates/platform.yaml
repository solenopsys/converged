{{- if .Values.platform.create }}
{{/*
The whole deployment, as one object.

Nothing below names a Deployment, a Service or a volume. Those are ptah's
output; this is its input. That is the difference from the generator this chart
replaces, which emitted every manifest at build time and therefore had to be
re-run and re-applied for any change a running platform could otherwise absorb.

The custom resources are cluster-scoped, so they are not created in the release
namespace and Helm cannot garbage-collect them by namespace. `helm uninstall`
does delete them, and ptah then prunes everything they own — except the
volumes, which it keeps unless they carry `ptah.io/reclaim: delete`.
*/}}
apiVersion: ptah.io/v1alpha1
kind: Platform
metadata:
  name: {{ .Values.platform.name }}
  labels:
    {{- include "ptah.labels" . | nindent 4 }}
spec:
  {{- include "ptah.platformSpec" . | nindent 2 }}
{{- end }}

{{- range $name, $spec := .Values.solutions }}
---
{{/*
A solution pinned in the cluster rather than fetched from the registry. The
platform reference is filled in here so the two cannot drift apart.
*/}}
apiVersion: ptah.io/v1alpha1
kind: Solution
metadata:
  name: {{ $name }}
  labels:
    {{- include "ptah.labels" $ | nindent 4 }}
spec:
  platform: {{ $.Values.platform.name }}
  {{- toYaml (omit $spec "platform") | nindent 2 }}
{{- end }}

{{- range $name, $spec := .Values.tenants }}
---
{{- if ne $.Values.platform.spec.profile "cloud" }}
{{- fail (printf "tenant %q needs a cloud platform; profile %q owns its storage on the platform instead" $name $.Values.platform.spec.profile) }}
{{- end }}
apiVersion: ptah.io/v1alpha1
kind: Tenant
metadata:
  name: {{ $name }}
  labels:
    {{- include "ptah.labels" $ | nindent 4 }}
  annotations:
    # A tenant outlives the release that introduced it: its storage is its
    # customer's data, not an install artefact.
    helm.sh/resource-policy: keep
spec:
  platform: {{ $.Values.platform.name }}
  {{- toYaml (omit $spec "platform") | nindent 2 }}
{{- end }}
