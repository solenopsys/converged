{{- if .Values.operator.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ptah.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ptah.selectorLabels" . | nindent 6 }}
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- if not .Values.leaderElection }}
  {{- fail "replicaCount above 1 requires leaderElection: true, or every replica reconciles the cluster at once" }}
  {{- end }}
  {{- end }}
  strategy:
    # Two reconcilers must not overlap. With the lease the second one would
    # only wait, and without it they would fight; either way, stopping the old
    # pod before starting the new one is the honest hand-off.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "ptah.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ptah.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # A reconcile pass runs to completion; killing it mid-apply is what
      # leaves half a platform behind. Ptah stops between passes on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: ptah
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            - name: PTAH_RESYNC_MS
              value: {{ mul .Values.resyncSeconds 1000 | quote }}
            - name: PTAH_LEADER_ELECTION
              value: {{ ternary "on" "off" .Values.leaderElection | quote }}
            # The lease holder id has to be unique per pod, and the pod name is
            # the only identifier that already is.
            - name: PTAH_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
