# Converged is installed from this file and nothing else.
#
# The chart deploys the operator and one Platform object. What that Platform
# turns into — how many pods, which modules, how storage is split — is ptah's
# decision at runtime, so this file describes intent rather than manifests.

# ---------------------------------------------------------------------------
# The operator
# ---------------------------------------------------------------------------
image:
  repository: public.ecr.aws/i5x9u8b2/ptah
  tag: latest
  pullPolicy: IfNotPresent

# More than one replica is safe: only the lease holder reconciles. A second
# replica buys a faster failover, not more throughput.
replicaCount: 1

# Time between full reconcile passes. Ptah resyncs on a timer rather than
# watching, and server-side apply makes a pass with no changes nearly free, so
# this is a latency knob and not a load one.
resyncSeconds: 30

# Turn off only for a single-replica cluster where the lease is pure overhead.
leaderElection: true

# Ptah reaches the apiserver through a proxy sidecar, not directly.
#
# Zig's TLS client does not implement the TLS 1.3 CertificateRequest message,
# and a Kubernetes apiserver sends one whenever client-certificate auth is
# enabled — the default. The handshake fails before any certificate is looked
# at, so this is not something a CA or hostname setting can fix. The sidecar
# does the TLS and re-exposes the API on loopback inside the pod.
apiProxy:
  enabled: true
  image: docker.io/rancher/kubectl:v1.34.1
  pullPolicy: IfNotPresent
  port: 8001
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Ptah writes cluster-scoped PersistentVolumes and reads cluster-scoped
  # custom resources, so its role cannot be namespaced.
  create: true

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# The platform
# ---------------------------------------------------------------------------
platform:
  # Set false to install the operator alone and manage Platform objects out of
  # band — useful when one operator serves several platforms.
  create: true
  name: converged

  # Passed to the Platform's `spec` verbatim. The CRD preserves unknown fields
  # and the policy is the single validator, so the shape here is the policy's
  # `PlatformSpec` and not a second schema that could disagree with it.
  spec:
    # mono  — one behemoth for the platform
    # multi — one behemoth per shard, split by scope
    # cloud — no platform storage; one behemoth per Tenant
    profile: cloud

    # Namespace the workloads land in. Defaults to the release namespace.
    namespace: ""

    # Tenant hostnames are derived from this: `<tenant>.<domainBase>`.
    domainBase: 4ir.club

    # Created out of band. Ptah references it and never writes it: real
    # credentials should not travel through a custom resource.
    secretName: converged-secrets

    images:
      ui: public.ecr.aws/i5x9u8b2/converged-ui:latest
      ms: public.ecr.aws/i5x9u8b2/converged-ms:latest

    cache:
      image: docker.io/valkey/valkey:8.1-alpine
      port: 6379

    storage:
      image: public.ecr.aws/i5x9u8b2/behemoth:latest
      size: 5Gi
      port: 9000
      mountBase: /app/data
      # No default: the cluster default class is a property of the cluster,
      # so leaving it unset makes the same values mean different storage in
      # different places.
      storageClassName: local-path
      # Every microservice gets its own volume. `{{volume}}` is that volume's
      # unique name; `{{platform}}`, `{{tenant}}`, `{{shard}}` and
      # `{{microservice}}` are also available. The template must resolve to a
      # distinct source per microservice or ptah refuses the platform.
      volumeSource:
        hostPath:
          path: /var/lib/ptah/{{volume}}
          type: DirectoryOrCreate
      # Required for `local`, and for any source pinned to one node.
      # nodeAffinity: {}

    # Required by `multi`, ignored otherwise. Exactly one shard must claim "*".
    shards: []
    # - name: alpha
    #   scopes: [acme, globex]
    #   size: 50Gi
    # - name: rest
    #   scopes: ["*"]

    # Where modules and the base solution configuration are fetched from.
    # Leave `url` empty to run entirely from what is baked into the images.
    registry:
      url: ""
      solutions: solutions/converged.json
      # Bump to force a re-fetch and a rollout on unchanged module lists.
      revision: ""
      cacheSize: 4Gi

    # Always-on peers of the message bus. fujin must declare both ports: `ws`
    # is what the gateway targets, `zmq` is what every other peer dials.
    apps:
      fujin:
        image: public.ecr.aws/i5x9u8b2/fujin:latest
        ports:
          ws: 8087
          zmq: 5557
      centimanus:
        image: public.ecr.aws/i5x9u8b2/centimanus:latest
        fujinTarget: centimanus
        fujinEndpointEnv: CENTIMANUS_FUJIN_ZMQ_ENDPOINT
        ports:
          http: 9000
      resonus:
        image: public.ecr.aws/i5x9u8b2/resonus:latest
        fujinTarget: resonus
        fujinEndpointEnv: RESONUS_FUJIN_ZMQ_ENDPOINT

    # Declared here, deployed only while a solution asks for them.
    processors:
      curaengine:
        image: public.ecr.aws/i5x9u8b2/curaengine:latest
        fujinTarget: curaengine
        fujinEndpointEnv: CURAENGINE_FUJIN_ZMQ_ENDPOINT
      opencamlib:
        image: public.ecr.aws/i5x9u8b2/opencamlib:latest
        fujinTarget: opencamlib
        fujinEndpointEnv: OPENCAMLIB_FUJIN_ZMQ_ENDPOINT

    gateway:
      className: traefik
      hosts:
        - "*.4ir.club"
      tls:
        secretName: 4ir-club-tls
        # With an issuer ptah emits a cert-manager Certificate; without one the
        # secret is expected to exist already.
        issuer: 4ir-club-cluster-issuer
        issuerKind: ClusterIssuer
        dnsNames:
          - 4ir.club
          - "*.4ir.club"

    replicas:
      ui: 1
      ms: 1

    # env: {}
    # resources:
    #   ui: {}
    #   ms: {}

# Solution objects to create alongside the platform. Normally empty: solutions
# come from the registry. This is the escape hatch for a solution that has to
# be pinned in the cluster itself.
solutions: {}
# cnc-club:
#   microservices: [geo, places]
#   microfrontends: [geo]
#   processors: [curaengine]

# Tenant objects to create at install time. Only meaningful for `cloud`, and
# normally left empty: tenants are created as sites are sold, not at install.
tenants: {}
# democnc:
#   storageSize: 20Gi
#   domains: [shop.example.com]
