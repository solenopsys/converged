{{- if .Values.platform.create }}
{{/*
The whole deployment, as one object.

Nothing below names a Deployment, a Service or a volume. Those are ptah's
output; this is its input.

The spec is written out here rather than assembled from values because it is
the same in every install: a peer set, the ports those peers dial, the shape
of a volume. Only what actually differs between workspaces is substituted, so
there is one place to read to know what a platform is.

The custom resources are cluster-scoped, so they are not created in the release
namespace and Helm cannot garbage-collect them by namespace. `helm uninstall`
does delete them, and ptah then prunes everything they own — except the
volumes, which it keeps unless they carry `ptah.io/reclaim: delete`.
*/}}
apiVersion: ptah.io/v1alpha1
kind: Platform
metadata:
  name: {{ include "ptah.workspace" . }}
  labels:
    {{- include "ptah.labels" . | trim | nindent 4 }}
spec:
  profile: {{ include "ptah.profile" . }}
  namespace: {{ include "ptah.workspace" . }}
  domainBase: {{ .Values.domainBase }}

  # Created out of band. Ptah references it and never writes it: real
  # credentials should not travel through a custom resource.
  secretName: {{ include "ptah.workspace" . }}-secrets

  images:
    ui: {{ .Values.images.registry }}/{{ include "ptah.workspace" . }}-ui:{{ .Values.images.tag }}
    ms: {{ .Values.images.registry }}/{{ include "ptah.workspace" . }}-ms:{{ .Values.images.tag }}

  replicas:
    ui: 1
    ms: 1

  storage:
    image: public.ecr.aws/i5x9u8b2/behemoth:latest
    size: {{ .Values.storage.size }}
    port: 9000
    # Behemoth runs valkey in-process. There is no cache workload to deploy;
    # this is only the second port its Service publishes.
    cachePort: 6379
    mountBase: /app/data
{{- if eq .Values.storage.mode "dynamic" }}
    # A claim per microservice and nothing else: the provisioner behind this
    # class creates the volume and owns its lifetime, so deleting the claim
    # takes the volume with it and a reinstall starts clean.
    storageClassName: {{ .Values.storage.storageClassName }}
{{- else if eq .Values.storage.mode "static" }}
    # ptah declares the volumes itself, so the class must have no provisioner
    # of its own to answer the same claims — see `ptah.staticStorageClass`.
    storageClassName: {{ include "ptah.staticStorageClass" . }}
    # Every microservice gets its own volume. `{{ "{{volume}}" }}` is that
    # volume's unique name; ptah refuses the platform if the template does not
    # resolve to a distinct source per microservice.
    #
    # `hostPath` with `DirectoryOrCreate` rather than a `local` source: ptah
    # names one directory per microservice and nothing pre-creates them on the
    # node, which a `local` volume requires. The node pinning that `local`
    # would have enforced is the nodeAffinity below, which ptah demands of any
    # node-local source.
    volumeSource:
      hostPath:
        path: {{ .Values.storage.static.hostPath }}/{{ "{{volume}}" }}
        type: DirectoryOrCreate
    # Omitted when empty rather than defaulted here: ptah is the one validator
    # of a Platform spec, and it rejects a node-local source that carries no
    # affinity. A `{}` written out would only turn that into a vaguer error.
    {{- with .Values.storage.static.nodeAffinity }}
    nodeAffinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- else }}
{{- fail (printf "storage.mode must be \"dynamic\" or \"static\", got %q" .Values.storage.mode) }}
{{- end }}

{{- if eq (include "ptah.profile" .) "multi" }}
  shards:
    {{- toYaml .Values.shards | trim | nindent 4 }}
{{- end }}

{{- if .Values.registry.url }}
  registry:
    url: {{ .Values.registry.url }}
    solutions: solutions/{{ include "ptah.workspace" . }}.json
    revision: {{ .Values.registry.revision | quote }}
    modules: {{ .Values.registry.modules | default dict | toJson }}
{{- end }}

{{- with .Values.env }}
{{/*
Extra environment for the platform's own workloads. The policy merges it over
everything it derives, so this is also the one place to correct a value ptah
computes wrongly for a particular cluster without waiting for a new operator.
*/}}
  env:
    {{- toYaml . | trim | nindent 4 }}
{{- end }}

  # Always-on peers of the message bus, and the compute peers a solution may
  # ask for. Both come from values so that a cluster can correct a peer — the
  # UDP range resonus needs, a replica count — without a new chart.
  apps:
    {{- include "ptah.nativePeers" (dict "root" . "peers" .Values.apps) | trim | nindent 4 }}

  # Declared here, deployed only while a solution asks for them. Naming one a
  # platform never uses costs nothing until it is selected.
  processors:
    {{- include "ptah.nativePeers" (dict "root" . "peers" .Values.processors) | trim | nindent 4 }}

  gateway:
    className: {{ .Values.gateway.className }}
    httpsPort: {{ .Values.gateway.httpsPort }}
    hosts:
      {{- if eq (include "ptah.profile" .) "cloud" }}
      {{/*
      Cloud sells a hostname per Tenant, so the listener has to accept names
      that do not exist yet; each Tenant's own HTTPRoute is what narrows it.
      */}}
      - "*.{{ .Values.domainBase }}"
      {{- else }}
      {{/*
      mono and multi answer on one set of hostnames, and that set is the base
      domain itself. A wildcard here would serve every name except the one the
      install is actually reachable at: `*.example` matches exactly one label
      and never the apex, so `https://example/` returns 404 from the router.
      */}}
      - {{ .Values.domainBase }}
      {{- end }}
    tls:
      secretName: {{ include "ptah.workspace" . }}-tls
      issuer: {{ .Values.gateway.issuer }}
      issuerKind: {{ .Values.gateway.issuerKind }}
      dnsNames:
        - {{ .Values.domainBase }}
        - "*.{{ .Values.domainBase }}"

{{/*
Solutions and Tenants are inputs to the same Platform, and cluster-scoped like
it. Rendering them outside this gate is what made an operator-only release —
one installed into kube-system with `platform.create=false` — still emit a
`Solution/<release-namespace>-<product>` that belongs to no platform, and then
collide with the workspace release that legitimately owns that name.
*/}}
{{- range $name, $spec := .Values.solutions }}
---
{{/*
A solution pinned in the cluster rather than fetched from the registry. The
platform reference is filled in here so the two cannot drift apart.
*/}}
apiVersion: ptah.io/v1alpha1
kind: Solution
metadata:
  {{/*
  Cluster-scoped, while `spec.platform` below scopes it to one platform — so
  the name has to carry that scope too. The values key is a product name, not
  a workspace, so without the prefix a second workspace in the same cluster
  renders this very object: Helm refuses to adopt it ("cannot be imported into
  the current release"), and were it not for that check the second install
  would silently retarget the first platform's solution at itself.
  */}}
  name: {{ printf "%s-%s" (include "ptah.workspace" $) $name }}
  labels:
    {{- include "ptah.labels" $ | trim | nindent 4 }}
spec:
  platform: {{ include "ptah.workspace" $ }}
  {{- toYaml (omit $spec "platform") | nindent 2 }}
{{- end }}

{{- range $name, $spec := .Values.tenants }}
---
{{- if ne (include "ptah.profile" $) "cloud" }}
{{- fail (printf "tenant %q needs a cloud platform; profile %q owns its storage on the platform instead" $name (include "ptah.profile" $)) }}
{{- end }}
apiVersion: ptah.io/v1alpha1
kind: Tenant
metadata:
  name: {{ $name }}
  labels:
    {{- include "ptah.labels" $ | trim | nindent 4 }}
  annotations:
    # A tenant outlives the release that introduced it: its storage is its
    # customer's data, not an install artefact.
    helm.sh/resource-policy: keep
spec:
  platform: {{ include "ptah.workspace" $ }}
  {{- toYaml (omit $spec "platform") | nindent 2 }}
{{- end }}
{{- end }}
