apiVersion: ptah.io/v1alpha1
kind: Solution
metadata:
  name: converged-converged
spec:
  platform: converged
  repositories:
    - access
    - auth
    - identity
    - markdown
    - struct
    - galery
    - assistant
    - calls
    - contexts
    - threads
    - dag
    - files
    - store
    - requests
    - logs
    - telemetry
    - counters
    - usage
    - dashboard
  lambdas:
    - ses
    - compressors
    - modelconvertor
  surfaces:
    - auth
    - assistants
    - calls
    - contexts
    - threads
    - requests
    - files
    - logs
    - telemetry
    - usage
    - dasboards
  processors:
    - curaengine
    - opencamlib
  workflows:
    - id: files-process
      name: wf-files-process
      script: workflows/wf-files-process.js
      brief: Process uploaded files
      description: Expand ZIP archives and classify every uploaded file, reporting
        which of them are production models. Does not create a request.
      parameters:
        type: object
        properties:
          fileIds:
            type: array
            items:
              type: string
        required:
          - fileIds
    - id: file-unpack
      name: wf-file-unpack
      script: workflows/wf-file-unpack.js
      brief: Unpack an uploaded archive
      description: Extract a ZIP archive and return IDs of its entries.
      parameters:
        type: object
        properties:
          fileId:
            type: string
        required:
          - fileId
    - id: file-analyze
      name: wf-file-analyze
      script: workflows/wf-file-analyze.js
    - id: files-analyze
      name: wf-files-analyze
      script: workflows/wf-files-analyze.js
    - id: request-analyze
      name: wf-request-analyze
      script: workflows/wf-request-analyze.js
