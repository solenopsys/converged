apiVersion: ptah.io/v1alpha1
kind: Solution
metadata:
  name: converged-converged
spec:
  platform: converged
  repositories:
    - access
    - auth
    - identity
    - markdown
    - struct
    - galery
    - assistant
    - calls
    - contexts
    - threads
    - dag
    - files
    - store
    - requests
    - logs
    - telemetry
    - counters
    - usage
    - dashboard
    - sheduller
    - webhooks
    - community
    - chats
    - orders
    - equipment
    - events
    - reviews
    - staff
    - notify
  lambdas:
    - ses
    - compressors
    - modelconvertor
  surfaces:
    - auth
    - assistants
    - calls
    - contexts
    - threads
    - requests
    - files
    - logs
    - telemetry
    - usage
    - dasboards
    - automation
    - community
    - chats
    - orders
    - equipment
    - reviews
    - team
  processors:
    - curaengine
    - opencamlib
  workflows:
    - id: files-process
      name: wf-files-process
      script: workflows/wf-files-process.js
      brief: Process uploaded files
      description: Expand ZIP archives and classify every uploaded file, reporting
        which of them are production models. Does not create a request.
      parameters:
        type: object
        properties:
          fileIds:
            type: array
            items:
              type: string
        required:
          - fileIds
    - id: file-unpack
      name: wf-file-unpack
      script: workflows/wf-file-unpack.js
      brief: Unpack an uploaded archive
      description: Extract a ZIP archive and return IDs of its entries.
      parameters:
        type: object
        properties:
          fileId:
            type: string
        required:
          - fileId
    - id: file-analyze
      name: wf-file-analyze
      script: workflows/wf-file-analyze.js
    - id: files-analyze
      name: wf-files-analyze
      script: workflows/wf-files-analyze.js
    - id: request-analyze
      name: wf-request-analyze
      script: workflows/wf-request-analyze.js
    - id: order-review-request
      name: wf-order-review-request
      script: workflows/wf-order-review-request.js
      brief: Ask a customer for a review
      description: Find one finished order that has a customer and has never been
        asked, mint its personal one-shot review link and send the ask. One mail
        per run; dryRun renders the mail and mints nothing.
      parameters:
        type: object
        properties:
          from:
            type: string
          shopName:
            type: string
          delayHours:
            type: number
          dryRun:
            type: boolean
        required:
          - from
    - id: order-review-followup
      name: wf-order-review-followup
      script: workflows/wf-order-review-followup.js
      brief: Chase a quiet review link
      description: Ask once more about a review link that was sent, never opened and
        not yet chased its allowance of times. One mail per run; dryRun renders
        the mail and counts nothing.
      parameters:
        type: object
        properties:
          from:
            type: string
          shopName:
            type: string
          delayDays:
            type: number
          maxFollowups:
            type: number
          dryRun:
            type: boolean
        required:
          - from
    - id: team-invite
      name: wf-team-invite
      script: workflows/wf-team-invite.js
      brief: Add people to the console from a list
      description: "Turn a pasted list of people (name + email, in any shape) or an
        uploaded file into user accounts with a role, staff cards and
        invitations, and send each of them a sign-in link. Re-running the same
        list adds nobody twice. Roles it may grant: manager, operator, viewer.
        dryRun reports what it would do and touches nothing."
      parameters:
        type: object
        properties:
          rawText:
            type: string
            description: The pasted list itself
          fileIds:
            type: array
            items:
              type: string
            description: rp-files ids of csv/xlsx/text lists
          preset:
            type: string
            enum:
              - manager
              - operator
              - viewer
            description: Role for everyone in this list
          tags:
            type: array
            items:
              type: string
            description: Group access tags, e.g. team-ops
          invitedBy:
            type: string
          from:
            type: string
            description: Sender address; without it no letters are sent
          consoleUrl:
            type: string
          subject:
            type: string
          provider:
            type: string
          model:
            type: string
          dryRun:
            type: boolean
